name: PR Quality Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    name: ESLint & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Quality Check
        run: npm run lint

  unit-and-integration:
    name: Jest Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Test Suites
        run: npm test -- --coverage

      - name: Run Requirements Coverage Gate
        run: npm run test:coverage-gate

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload Requirements Traceability Report
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: coverage-report.json
          retention-days: 7

  e2e-smoke-test:
    name: E2E Smoke Test (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Chromium Tests
        run: xvfb-run npm run test:e2e:chromium

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7
